name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # TEST & LINT
  # ──────────────────────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ./TradingAgents
          pip install pytest pytest-asyncio pytest-xprocess aiosqlite

      - name: Run tests
        run: |
          pytest tests/ -v -p no:anchorpy -q

      - name: Lint Python code
        run: |
          pip install ruff
          # correctness only (syntax errors, undefined names); style backlog is not gating yet
          ruff check hybrid/ --select=E9,F63,F7,F82

      - name: Type check
        run: |
          pip install mypy
          mypy hybrid/ --ignore-missing-imports

  # ──────────────────────────────────────────────
  # DEPLOY TO ORACLE CLOUD (Always Free Ampere VM)
  # ──────────────────────────────────────────────
  # One VM runs the docker compose stack; this job SSHes in and runs
  # scripts/deploy.sh for the exact commit that passed tests. The stack is
  # updated in place (one bot, never duplicates). Secrets live in the VM's .env.
  # Approval: the `production` environment should require a reviewer
  # (Settings → Environments). Setup: DEPLOY.md.
  deploy:
    name: Deploy to Oracle Cloud VM
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false  # never interrupt a deploy halfway
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - name: Check deploy is configured
        id: cfg
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ]; then
            echo "::notice::Deploy skipped: DEPLOY_HOST / DEPLOY_USER secrets not set (see DEPLOY.md)"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Configure SSH
        if: steps.cfg.outputs.configured == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # pinned host key: refuse to deploy to anything else
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy commit
        if: steps.cfg.outputs.configured == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- $GITHUB_SHA" < scripts/deploy.sh

  # ──────────────────────────────────────────────
  # NOTIFY ON FAILURE
  # ──────────────────────────────────────────────
  notify:
    name: Notify on Failure
    needs: [test, deploy]
    if: failure()
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Send Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "🚨 CI/CD Pipeline Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Repository:* ${{ github.repository }}\n*Branch:* ${{ github.ref }}\n*Workflow:* ${{ github.workflow }}\n*Run:* ${{ github.run_id }}\n*Commit:* ${{ github.sha }}"
                  }
                }
              ]
            }
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}