name: Development CI

on:
  push:
    branches: [develop, feature/*]
  pull_request:
    branches: [main, develop]

jobs:
  quick-check:
    name: Quick Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt && pip install -e ./TradingAgents
      - run: pytest tests/ -v -p no:anchorpy -q --tb=short
      - run: ruff check hybrid/ --select=E,F,W,I
      - run: mypy hybrid/ --ignore-missing-imports