name: Development CI

on:
  push:
    branches: [develop, feature/*]
  pull_request:
    branches: [main, develop]

jobs:
  quick-check:
    name: Quick Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
          cache: 'pip'
          cache-dependency-path: |
            constraints.txt
            requirements*.txt
            TradingAgents/pyproject.toml
      - run: python -m pip install -c constraints.txt -r requirements-dev.txt
      - run: python -m pip check
      - run: pytest tests/ -v -p no:anchorpy -q --tb=short
      - run: ruff check hybrid/ --select=E9,F63,F7,F82
      - run: mypy hybrid/ --ignore-missing-imports
