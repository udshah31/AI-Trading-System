version: '3.8'

services:
  # Infrastructure
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"  # localhost only: no network auth beyond DB_PASSWORD
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d trading"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # append-only file: the bot's saved positions survive a crash (fsync every second)
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"  # localhost only: Redis has no password
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Monitoring
  prometheus:
    image: prom/prometheus:v2.47.0
    ports:
      - "127.0.0.1:9090:9090"  # localhost only: Prometheus has no auth
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    secrets:
      - dashboard_password  # basic auth for scraping the dashboard's /metrics
    depends_on:
      - redis
      - postgres

  grafana:
    image: grafana/grafana:10.1.0
    ports:
      - "127.0.0.1:3000:3000"  # localhost only
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-dashboard.json:/var/lib/grafana/dashboards/trading-dashboard.json
      - ./grafana-provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

  # Application
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      # localhost by default (reach it over an SSH tunnel). Basic auth, fails closed without
      # DASHBOARD_PASSWORD; set DASHBOARD_BIND=0.0.0.0 only behind TLS (see DEPLOY.md)
      - "${DASHBOARD_BIND:-127.0.0.1}:8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql+asyncpg://trader:${DB_PASSWORD:-secret}@postgres:5432/trading
      - DASHBOARD_USER=${DASHBOARD_USER:-admin}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:?set DASHBOARD_PASSWORD in .env}
      - DASHBOARD_CORS_ORIGINS=${DASHBOARD_CORS_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./hybrid:/app/hybrid
    command: uvicorn hybrid.dashboard.app:app --host 0.0.0.0 --port 8000

  # Trading system: hybrid/main_async.py runs every agent (data, quant, risk,
  # execution, orchestrator, LLM, storage, BTC funding, optional sniper) in one
  # process over the Redis bus. Orders are simulated unless LIVE_TRADING=true.
  trading-system:
    build:
      context: .
      dockerfile: Dockerfile.agent
    command: python -m hybrid.main_async
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql+asyncpg://trader:${DB_PASSWORD:-secret}@postgres:5432/trading
      - LIVE_TRADING=${LIVE_TRADING:-false}
      - BROKER=${BROKER:-alpaca}
      - ENABLE_SNIPER=${ENABLE_SNIPER:-false}
      - KRAKEN_API_KEY=${KRAKEN_API_KEY}
      - KRAKEN_API_SECRET=${KRAKEN_API_SECRET}
      - KRAKEN_FUTURES_API_KEY=${KRAKEN_FUTURES_API_KEY}
      - KRAKEN_FUTURES_API_SECRET=${KRAKEN_FUTURES_API_SECRET}
      - KRAKEN_FUTURES_PASSPHRASE=${KRAKEN_FUTURES_PASSPHRASE}
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - TYPESAFE_API_KEY=${TYPESAFE_API_KEY}
      - TRADINGAGENTS_LLM_PROVIDER=google
      - TRADINGAGENTS_DEEP_THINK_LLM=gemini-2.5-flash
      - TRADINGAGENTS_QUICK_THINK_LLM=gemini-2.5-flash
      - SOLANA_RPC_URL=${SOLANA_RPC_URL}
      - SOLANA_PRIVATE_KEY=${SOLANA_PRIVATE_KEY}
      - EVM_PRIVATE_KEY=${EVM_PRIVATE_KEY}
      - BASE_RPC_URL=${BASE_RPC_URL}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

secrets:
  dashboard_password:
    environment: DASHBOARD_PASSWORD

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
