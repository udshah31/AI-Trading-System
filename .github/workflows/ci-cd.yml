name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # TEST & LINT
  # ──────────────────────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
          cache: 'pip'
          cache-dependency-path: |
            constraints.txt
            requirements*.txt
            TradingAgents/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -r requirements-dev.txt
          python -m pip check

      - name: Run tests
        run: |
          pytest tests/ -v -p no:anchorpy -q

      - name: Lint Python code
        run: |
          # correctness only (syntax errors, undefined names); style backlog is not gating yet
          ruff check hybrid/ --select=E9,F63,F7,F82

      - name: Type check
        run: |
          mypy hybrid/ --ignore-missing-imports

      # Deploy on this same runner after all checks pass. A second GitHub-hosted
      # runner made production deployment queue indefinitely and get cancelled.
      # Secrets live in the VM's .env. Setup: DEPLOY.md.
      - name: Check deploy is configured
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: cfg
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ]; then
            echo "::notice::Deploy skipped: DEPLOY_HOST / DEPLOY_USER secrets not set (see DEPLOY.md)"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH for production deploy
        if: steps.cfg.outputs.configured == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # pinned host key: refuse to deploy to anything else
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy to Oracle Cloud VM
        if: steps.cfg.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- $GITHUB_SHA" < scripts/deploy.sh

  # ──────────────────────────────────────────────
  # NOTIFY ON FAILURE
  # ──────────────────────────────────────────────
  notify:
    name: Notify on Failure
    needs: test
    if: failure()
    runs-on: ubuntu-24.04
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Send Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "🚨 CI/CD Pipeline Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Repository:* ${{ github.repository }}\n*Branch:* ${{ github.ref }}\n*Workflow:* ${{ github.workflow }}\n*Run:* ${{ github.run_id }}\n*Commit:* ${{ github.sha }}"
                  }
                }
              ]
            }
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
