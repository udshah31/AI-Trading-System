name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_TENANCY_NAMESPACE }}
  IMAGE_NAME: ai-trading-system
  OCI_CLI_VERSION: 4.5.0

jobs:
  # ──────────────────────────────────────────────
  # TEST & LINT
  # ──────────────────────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ./TradingAgents
          pip install pytest pytest-asyncio pytest-xprocess

      - name: Run tests
        run: |
          pytest tests/ -v -p no:anchorpy -q

      - name: Lint Python code
        run: |
          pip install ruff
          ruff check hybrid/ --select=E,F,W,I

      - name: Type check
        run: |
          pip install mypy
          mypy hybrid/ --ignore-missing-imports

  # ──────────────────────────────────────────────
  # BUILD & PUSH DOCKER IMAGE
  # ──────────────────────────────────────────────
  build:
    name: Build & Push Docker Image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install OCI CLI
        run: |
          curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh | bash -s -- --accept-all-defaults
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Login to OCI Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.OCI_AUTH_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # DEPLOY TO ORACLE CLOUD (OCI)
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to Oracle Cloud
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install OCI CLI
        run: |
          curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh | bash -s -- --accept-all-defaults
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          cat > ~/.oci/config << EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/private_key.pem
          EOF
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/private_key.pem
          chmod 600 ~/.oci/private_key.pem

      - name: Deploy to OCI Container Instances
        run: |
          # Create or update container instance
          oci container-instances container-instance create \
            --compartment-id ${{ secrets.OCI_COMPARTMENT_OCID }} \
            --display-name ai-trading-system \
            --shape-name VM.Standard.E3.Flex \
            --shape-config '{"ocpus": 2, "memoryInGBs": 16}' \
            --containers '[{"name": "ai-trading-system", "imageUrl": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest", "portMappings": [{"containerPort": 8000}], "environmentVariables": {"PYTHONPATH": "/app", "DATABASE_URL": "${{ secrets.DATABASE_URL }}", "REDIS_URL": "${{ secrets.REDIS_URL }}", "KRAKEN_API_KEY": "${{ secrets.KRAKEN_API_KEY }}", "KRAKEN_API_SECRET": "${{ secrets.KRAKEN_API_SECRET }}", "GOOGLE_API_KEY": "${{ secrets.GOOGLE_API_KEY }}", "SENTRY_ACCESS_TOKEN": "${{ secrets.SENTRY_ACCESS_TOKEN }}", "EXA_API_KEY": "${{ secrets.EXA_API_KEY }}", "BROWSER_USE_API_KEY": "${{ secrets.BROWSER_USE_API_KEY }}", "ANTHROPIC_API_KEY": "${{ secrets.ANTHROPIC_API_KEY }}", "OPENAI_API_KEY": "${{ secrets.OPENAI_API_KEY }}", "OPENROUTER_API_KEY": "${{ secrets.OPENROUTER_API_KEY }}", "EMBEDDED_AGENT_PROVIDER": "openai", "SENTRY_ACCESS_TOKEN": "${{ secrets.SENTRY_ACCESS_TOKEN }}"}]' \
            --vnics '[{"subnetId": "${{ secrets.OCI_SUBNET_OCID }}", "assignPublicIp": true}]' \
            --wait-for-state RUNNING

      - name: Verify deployment
        run: |
          # Wait for health check
          sleep 30
          INSTANCE_IP=$(oci container-instances container-instance list --compartment-id ${{ secrets.OCI_COMPARTMENT_OCID }} --display-name ai-trading-system --query "data[0].containers[0].ipAddresses[0].ipAddress" --raw-output)
          curl -f "http://${INSTANCE_IP}:8000/health" || exit 1
          echo "Deployment successful! Service running at http://${INSTANCE_IP}:8000"

  # ──────────────────────────────────────────────
  # NOTIFY ON FAILURE
  # ──────────────────────────────────────────────
  notify:
    name: Notify on Failure
    needs: [test, build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "🚨 CI/CD Pipeline Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Repository:* ${{ github.repository }}\n*Branch:* ${{ github.ref }}\n*Workflow:* ${{ github.workflow }}\n*Run:* ${{ github.run_id }}\n*Commit:* ${{ github.sha }}"
                  }
                }
              ]
            }
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}